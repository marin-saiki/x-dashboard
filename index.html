<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="/x-dashboard/" />
<title>X 運用ダッシュボード / UMAPRO INC.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Anton&family=Noto+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  color-scheme: light;
  --red:#c0392b;
  --red-hover:#a93226;
  --red-pale:#e3b9b3;
  --s1:#c0392b;            /* 系列1 おすすめ（朱・濃） */
  --s2:#e1897e;            /* 系列2 フォロー中（朱・淡） */
  --black:#0b0b0d;
  --text:#222222;
  --text-2:#5b5f66;
  --text-3:#8b9097;
  --white:#ffffff;
  --gray-bg:#f7f7f8;
  --border:#e6e6e9;
  --grid:#ededf0;
  --shadow:0 6px 20px rgba(0,0,0,.10);
  --shadow-lg:0 12px 40px rgba(0,0,0,.14);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --s1:#b02620; --s2:#d57368;
    --text:#f2f2f3; --text-2:#aeb2b8; --text-3:#80858c;
    --white:#131316; --gray-bg:#0f0f12; --border:#2a2a2f; --grid:#232327;
    --shadow:0 6px 20px rgba(0,0,0,.5); --shadow-lg:0 12px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --s1:#b02620; --s2:#d57368;
  --text:#f2f2f3; --text-2:#aeb2b8; --text-3:#80858c;
  --white:#131316; --gray-bg:#0f0f12; --border:#2a2a2f; --grid:#232327;
  --shadow:0 6px 20px rgba(0,0,0,.5); --shadow-lg:0 12px 40px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--white);color:var(--text);
  font-family:"Noto Sans JP","Zen Kaku Gothic New",-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  line-height:1.7;
}
.num{font-family:"DM Mono","Space Grotesk",ui-monospace,monospace;font-feature-settings:"tnum" 1}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ===== 黒のヒーロー（タイルが集まって数字になる） ===== */
.hero{background:var(--black);color:#fff;position:relative;overflow:hidden;
  min-height:620px;height:78svh;display:flex;flex-direction:column}
/* 中段が残りの高さを占め、そこだけをキャンバスにする（上下の文字と絶対に重ならない） */
.hero-mid{position:relative;flex:1 1 auto;min-height:150px;z-index:0}
#heroCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:auto -20% -60% 45%;width:70%;aspect-ratio:1;
  background:radial-gradient(circle,rgba(192,57,43,.28),transparent 70%);pointer-events:none;z-index:0}
.hero-top,.hero-bot{position:relative;z-index:2}
.hero-top{padding-top:34px}
.hero-bot{padding-bottom:26px}
.brandline{display:flex;align-items:center;gap:12px}
.brandline .mark{width:28px;height:28px;border-radius:999px;background:var(--red);flex:none}
.brandline .nm{font-family:"Anton",sans-serif;font-size:17px;letter-spacing:.14em;color:#fff}
.brandline .sub{font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.5);
  font-family:"Space Grotesk",sans-serif}
.hero .lab{font-family:"Space Grotesk",sans-serif;font-size:11px;letter-spacing:.24em;
  color:rgba(255,255,255,.55);font-weight:600;margin-top:22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:7px;
  padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  font-size:13px;font-weight:700;letter-spacing:.08em;color:#fff}
.tag.up{background:var(--red)}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:34px;flex-wrap:wrap}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:26px;
  flex:1;min-width:280px}
.hs .k{font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.55);
  display:flex;align-items:center;gap:6px}
.hs .k i{width:9px;height:9px;border-radius:999px;flex:none}
.hs .v{font-family:"Anton",sans-serif;font-size:30px;margin-top:5px;letter-spacing:.02em}
.hs .v small{font-family:"Noto Sans JP",sans-serif;font-size:12px;font-weight:400;
  color:rgba(255,255,255,.5);margin-left:4px}
.hs .n{font-size:10.5px;color:rgba(255,255,255,.42);margin-top:2px}
.hero-sp{margin-bottom:4px}
.replay{background:none;border:1.5px solid rgba(255,255,255,.22);color:rgba(255,255,255,.6);
  border-radius:999px;padding:6px 15px;font-size:11px;cursor:pointer;font-family:inherit;
  letter-spacing:.08em;transition:.15s;min-height:32px}
.replay:hover{border-color:var(--red);background:var(--red);color:#fff}
.scrolldown{display:block;text-align:center;margin-top:16px;color:rgba(255,255,255,.5);
  font-size:25px;text-decoration:none;position:relative;z-index:2;
  animation:bounce 1.8s ease-in-out infinite}
.scrolldown:hover{color:#fff}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
@media(prefers-reduced-motion:reduce){.scrolldown{animation:none}}
@media(max-width:820px){.hero{height:auto;min-height:0;padding-bottom:10px}
  .hero-mid{min-height:240px;height:240px;flex:none}
  .hero-top{padding-top:28px}.hero-bot{padding-bottom:18px}
  .hero-row{gap:22px}}

/* ===== セクション ===== */
section.body{padding:58px 0 0}
.sec{margin-bottom:46px}
.sec-h{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.sec-h h2{font-family:"Zen Kaku Gothic New",sans-serif;font-size:17px;font-weight:900;
  letter-spacing:.14em;margin:0;color:var(--text)}
.sec-h .en{font-family:"Space Grotesk",sans-serif;font-size:10.5px;letter-spacing:.2em;
  color:var(--text-3);font-weight:600}
.sec-h::after{content:"";flex:1;height:2px;background:var(--border)}

.card{background:var(--white);border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow);padding:24px 26px}
.card h3{font-family:"Zen Kaku Gothic New",sans-serif;font-size:14px;font-weight:700;
  letter-spacing:.08em;margin:0 0 4px;color:var(--text)}
.card .cap{font-size:11.5px;color:var(--text-3);margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}

.legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px;font-size:12px;color:var(--text-2)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}

/* ===== 時間グリッド（色を増やさず 塗り量＋記号で区別） ===== */
.hours{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:7px}
.hr{border:1.5px solid var(--border);border-radius:12px;background:var(--white);
  padding:10px 4px 9px;text-align:center;position:relative;overflow:hidden;
  transition:transform .12s ease,box-shadow .12s ease}
.hr:hover{transform:translateY(-2px);box-shadow:var(--shadow);z-index:2}
.hr .t{font-family:"DM Mono",monospace;font-size:11.5px;font-weight:500;color:var(--text-2)}
.hr .m{font-size:10px;margin-top:3px;font-weight:700;letter-spacing:.04em}
.hr .fill{position:absolute;left:0;bottom:0;height:4px;background:var(--border)}
.hr.ok{border-color:var(--red)}
.hr.ok .fill{background:var(--red);width:100%} .hr.ok .m{color:var(--red)}
.hr.part{border-color:var(--red-pale)}
.hr.part .fill{background:var(--red)} .hr.part .m{color:var(--red)}
.hr.bad{border-color:var(--text);border-style:solid}
.hr.bad .fill{background:var(--text);width:100%} .hr.bad .m{color:var(--text)}
.hr.idle{border-style:dashed;background:var(--gray-bg)}
.hr.idle .t,.hr.idle .m{color:var(--text-3)}

/* ===== 表 ===== */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:16px;background:var(--white);
  box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th,td{padding:12px 15px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--gray-bg);color:var(--text-2);font-weight:700;font-size:10.5px;
  letter-spacing:.1em;font-family:"Zen Kaku Gothic New",sans-serif}
th:first-child,td:first-child{text-align:left}
td.num{font-family:"DM Mono",monospace}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(192,57,43,.045)}
td.up{color:var(--red);font-weight:700}
td.zero{color:var(--text-3)}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:11px;font-weight:700}
.pill.ok{background:var(--red);color:#fff}
.pill.part{background:transparent;color:var(--red);border:1.5px solid var(--red-pale)}
.pill.bad{background:var(--text);color:var(--white)}

.empty{padding:44px;text-align:center;color:var(--text-3);font-size:13px}
footer{margin-top:60px;background:var(--black);color:rgba(255,255,255,.45);padding:28px 0;font-size:11.5px}
footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
footer b{color:#fff;font-family:"Anton",sans-serif;letter-spacing:.12em;font-weight:400}
.themebtn{background:none;border:1.5px solid rgba(255,255,255,.25);color:rgba(255,255,255,.7);
  border-radius:999px;padding:7px 16px;font-size:11.5px;cursor:pointer;font-family:inherit;
  font-weight:700;letter-spacing:.06em;transition:.15s;min-height:34px}
.themebtn:hover{border-color:var(--red);background:var(--red);color:#fff}

#tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;z-index:999;
  background:var(--black);color:#fff;border-radius:12px;padding:11px 14px;font-size:12px;
  line-height:1.6;box-shadow:0 12px 40px rgba(0,0,0,.35);max-width:240px}
#tip b{font-size:12.5px;display:block;margin-bottom:4px;font-weight:700}
#tip .row{display:flex;justify-content:space-between;gap:16px}
#tip .row span:last-child{font-family:"DM Mono",monospace}
#tip i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
svg .hit{fill:transparent;cursor:pointer}
svg text{font-family:"DM Mono","Space Grotesk",monospace}
</style>
</head>
<body data-lang="ja">

<div class="hero" id="hero">
  <div class="wrap hero-top">
    <div class="brandline">
      <span class="mark"></span>
      <span class="nm">UMAPRO</span>
      <span class="sub">X OPERATIONS</span>
    </div>
    <div class="lab">FOLLOWERS</div>
    <p class="sr" id="heroFollowers">—</p>
  </div>

  <div class="hero-mid"><canvas id="heroCanvas" aria-hidden="true"></canvas></div>

  <div class="wrap hero-bot">
    <div class="hero-row">
      <div>
        <div class="hero-sp" id="spark"></div>
        <div id="heroDelta"></div>
      </div>
      <div class="hero-stats" id="heroStats"></div>
      <button class="replay" id="replay" type="button">↻ もう一度</button>
    </div>
    <a class="scrolldown" href="#main" aria-label="下へ"
       onclick="event.preventDefault();document.getElementById('main').scrollIntoView({behavior:'smooth'})">▾</a>
  </div>
</div>

<section class="body" id="main">
  <div class="wrap">

    <div class="sec">
      <div class="sec-h"><h2>本日の稼働</h2><span class="en">HOURLY</span></div>
      <div class="card">
        <h3>時間ごとの実行状況</h3>
        <div class="cap">各マスが1時間ぶんの実行。7時から22時まで毎時動きます。</div>
        <div class="hours" id="hours"></div>
        <div class="legend">
          <span><i style="background:var(--red)"></i>✓ 完了</span>
          <span><i style="background:transparent;border:2px solid var(--red-pale)"></i>△ 一部のみ</span>
          <span><i style="background:var(--text)"></i>✕ 失敗</span>
          <span><i style="background:var(--gray-bg);border:1.5px dashed var(--text-3)"></i>— 未実行</span>
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h"><h2>推移</h2><span class="en">DAILY TREND</span></div>
      <div class="grid2">
        <div class="card">
          <h3>フォロワー数</h3>
          <div class="cap">日ごとの推移</div>
          <div id="chartFollowers"></div>
        </div>
        <div class="card">
          <h3>いいね件数</h3>
          <div class="cap">おすすめ／フォロー中の内訳</div>
          <div id="chartLikes"></div>
          <div class="legend">
            <span><i style="background:var(--s1)"></i>おすすめ</span>
            <span><i style="background:var(--s2)"></i>フォロー中</span>
          </div>
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h"><h2>効率</h2><span class="en">EFFICIENCY</span></div>
      <div class="card">
        <h3>増加率</h3>
        <div class="cap">おすすめタブのいいね100件に対して、フォロワーが何人増えたか</div>
        <div id="chartRate"></div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h"><h2>日ごとの記録</h2><span class="en">LOG</span></div>
      <div class="tw" id="dailyTable"></div>
    </div>

    <div class="sec">
      <div class="sec-h"><h2>実行ログ</h2><span class="en">RUNS</span></div>
      <div class="tw" id="runsTable"></div>
    </div>

  </div>
</section>

<footer>
  <div class="wrap">
    <span><b>UMAPRO INC.</b>　UMAIで世界を平和にする。</span>
    <span>更新 <span id="gen">—</span>　<button class="themebtn" id="themebtn">表示切替</button></span>
  </div>
</footer>
<div id="tip"></div>

<script>
const $ = s => document.querySelector(s);
const N = v => (v === null || v === undefined) ? "—" : Number(v).toLocaleString("ja-JP");
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SVGNS = "http://www.w3.org/2000/svg";
const el = (t, a = {}) => { const e = document.createElementNS(SVGNS, t);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

const tip = $("#tip");
function showTip(html, ev){
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 16, y = ev.clientY - r.height - 12;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 16;
  if (y < 8) y = ev.clientY + 18;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => tip.style.opacity = 0;
addEventListener("scroll", hideTip, {passive:true});

/* ---------- 折れ線 ---------- */
function lineChart(mount, rows, key, color, opt = {}) {
  const {unit = "", fill = true, zeroLine = false, label = "値"} = opt;
  mount.innerHTML = "";
  const pts = rows.filter(r => r[key] !== null && r[key] !== undefined);
  if (!pts.length) { mount.innerHTML = '<div class="empty">データがありません</div>'; return; }
  const W = Math.max(mount.clientWidth || 480, 240), H = 196, m = {t:18, r:16, b:28, l:46};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = pts.map(p => +p[key]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (zeroLine) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * .18; lo -= pad; hi += pad;
  const step = (hi - lo) / 3;
  const dec = step >= 5 ? 0 : step >= 1 ? 1 : 2;
  const fmtAxis = v => v.toFixed(dec);
  const fmtVal = v => dec === 0 ? N(Math.round(v)) : (+v).toFixed(Math.min(dec, 2));
  const X = i => m.l + (pts.length === 1 ? iw/2 : i / (pts.length - 1) * iw);
  const Y = v => m.t + ih - (v - lo) / (hi - lo) * ih;
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, width:"100%", height:H,
    role:"img", "aria-label":label + "の推移"});
  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi - lo) * i / 3, y = Y(v);
    svg.appendChild(el("line", {x1:m.l, x2:W-m.r, y1:y, y2:y, stroke:cssv("--grid"), "stroke-width":1}));
    const tx = el("text", {x:m.l-8, y:y+4, "text-anchor":"end", "font-size":10, fill:cssv("--text-3")});
    tx.textContent = fmtAxis(v); svg.appendChild(tx);
  }
  const line = pts.map((p,i)=>`${X(i)},${Y(+p[key])}`).join(" ");
  if (fill) svg.appendChild(el("polygon", {points:`${m.l},${m.t+ih} ${line} ${X(pts.length-1)},${m.t+ih}`,
    fill:color, opacity:.09}));
  if (zeroLine && lo < 0 && hi > 0) svg.appendChild(el("line", {x1:m.l, x2:W-m.r, y1:Y(0), y2:Y(0),
    stroke:cssv("--text-3"), "stroke-width":1}));
  svg.appendChild(el("polyline", {points:line, fill:"none", stroke:color, "stroke-width":2,
    "stroke-linejoin":"round", "stroke-linecap":"round"}));
  pts.forEach((p,i) => svg.appendChild(el("circle", {cx:X(i), cy:Y(+p[key]), r:4.5, fill:color,
    stroke:cssv("--white"), "stroke-width":2})));
  const last = pts[pts.length-1];
  const lt = el("text", {x:X(pts.length-1)-7, y:Y(+last[key])-13, "text-anchor":"end",
    "font-size":12, "font-weight":600, fill:cssv("--text")});
  lt.textContent = fmtVal(last[key]) + unit; svg.appendChild(lt);
  [[0, pts[0].date], [pts.length-1, last.date]].forEach(([i,d],k) => {
    const t = el("text", {x:X(i), y:H-8, "font-size":10, fill:cssv("--text-3"),
      "text-anchor": k===0 ? "start" : "end"});
    t.textContent = (d||"").slice(5); svg.appendChild(t);
  });
  pts.forEach((p,i) => {
    const w = iw / Math.max(1, pts.length);
    const r = el("rect", {x:X(i)-w/2, y:m.t, width:w, height:ih, class:"hit"});
    r.addEventListener("mousemove", e => showTip(
      `<b>${p.date}</b><div class="row"><span><i style="background:${color}"></i>${label}</span><span>${fmtVal(p[key])}${unit}</span></div>`, e));
    r.addEventListener("mouseleave", hideTip);
    svg.appendChild(r);
  });
  mount.appendChild(svg);
}

/* ---------- 積み上げ棒 ---------- */
function stackedBars(mount, rows) {
  mount.innerHTML = "";
  if (!rows.length) { mount.innerHTML = '<div class="empty">データがありません</div>'; return; }
  const W = Math.max(mount.clientWidth || 480, 240), H = 196, m = {t:18, r:16, b:28, l:46};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = Math.max(1, ...rows.map(r => r.total_likes || 0));
  const band = iw / rows.length, bw = Math.max(2, Math.min(24, band * .6));
  const s1 = cssv("--s1"), s2 = cssv("--s2");
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, width:"100%", height:H,
    role:"img", "aria-label":"いいね件数の内訳"});
  for (let i = 0; i <= 3; i++) {
    const y = m.t + ih - ih*i/3;
    svg.appendChild(el("line", {x1:m.l, x2:W-m.r, y1:y, y2:y, stroke:cssv("--grid"), "stroke-width":1}));
    const t = el("text", {x:m.l-8, y:y+4, "text-anchor":"end", "font-size":10, fill:cssv("--text-3")});
    t.textContent = N(Math.round(max*i/3)); svg.appendChild(t);
  }
  rows.forEach((r,i) => {
    const cx = m.l + band*i + band/2, base = m.t + ih;
    const h1 = (r.foryou_likes||0)/max*ih, h2 = (r.following_likes||0)/max*ih;
    if (h1 > 0) svg.appendChild(el("rect", {x:cx-bw/2, y:base-h1, width:bw, height:h1, fill:s1}));
    if (h2 > 0) {
      const y2 = base - h1 - 2 - h2;     // 2px の面色ギャップで段を分ける
      svg.appendChild(el("rect", {x:cx-bw/2, y:y2, width:bw, height:h2, fill:s2, rx:4, ry:4}));
      svg.appendChild(el("rect", {x:cx-bw/2, y:y2+h2-4, width:bw, height:4, fill:s2}));
    }
    const hit = el("rect", {x:cx-band/2, y:m.t, width:band, height:ih, class:"hit"});
    hit.addEventListener("mousemove", e => showTip(
      `<b>${r.date}</b>
       <div class="row"><span><i style="background:${s1}"></i>おすすめ</span><span>${N(r.foryou_likes)}</span></div>
       <div class="row"><span><i style="background:${s2}"></i>フォロー中</span><span>${N(r.following_likes)}</span></div>
       <div class="row" style="border-top:1px solid rgba(255,255,255,.22);margin-top:5px;padding-top:5px">
         <span>合計</span><span>${N(r.total_likes)}</span></div>`, e));
    hit.addEventListener("mouseleave", hideTip);
    svg.appendChild(hit);
  });
  [[0, rows[0].date], [rows.length-1, rows[rows.length-1].date]].forEach(([i,d],k)=>{
    const t = el("text", {x:m.l+band*i+band/2, y:H-8, "font-size":10, fill:cssv("--text-3"),
      "text-anchor":"middle"});
    t.textContent = (d||"").slice(5); svg.appendChild(t);
  });
  mount.appendChild(svg);
}

/* ---------- スパークライン（黒地） ---------- */
function spark(mount, rows) {
  mount.innerHTML = "";
  const pts = rows.filter(r => r.followers != null);
  if (pts.length < 2) return;
  const W = 250, H = 46, vals = pts.map(p=>p.followers);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo--; hi++; }
  const X = i => i/(pts.length-1)*(W-6)+3, Y = v => H-5 - (v-lo)/(hi-lo)*(H-14);
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, width:W, height:H, "aria-hidden":"true"});
  const d = pts.map((p,i)=>`${X(i)},${Y(p.followers)}`).join(" ");
  svg.appendChild(el("polygon", {points:`3,${H-2} ${d} ${W-3},${H-2}`, fill:"#c0392b", opacity:.26}));
  svg.appendChild(el("polyline", {points:d, fill:"none", stroke:"#e1897e", "stroke-width":2,
    "stroke-linecap":"round", "stroke-linejoin":"round"}));
  svg.appendChild(el("circle", {cx:X(pts.length-1), cy:Y(vals[vals.length-1]), r:4,
    fill:"#fff", stroke:"#c0392b", "stroke-width":2}));
  mount.appendChild(svg);
}

/* ============================================================
   ヒーロー演出：小さな赤タイルが飛んできてフォロワー数を形づくる
   （公式サイトの「旨」イントロと同じ組み立て方・タイル1枚＝いいね1件）
   ============================================================ */
const Hero = (function () {
  const hero = $("#hero"), cv = $("#heroCanvas");
  if (!cv) return {play(){}, setText(){}};
  const ctx = cv.getContext("2d");
  let W, H, DPR, targets = [], parts = [], t0 = null, raf = null, running = false;
  let text = "0";
  const DURATION = 2600, STEP = 9, TILE = 7.5;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const easeOutCubic = p => 1 - Math.pow(1 - p, 3);

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    const r = hero.getBoundingClientRect();
    W = cv.clientWidth || r.width; H = cv.clientHeight || r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // 数字をオフスクリーンに描いて、塗られている画素をタイルの着地点にする
  function buildTargets() {
    const S = 520, off = document.createElement("canvas");
    off.width = S; off.height = Math.round(S * 0.52);
    const o = off.getContext("2d");
    o.fillStyle = "#000"; o.fillRect(0, 0, off.width, off.height);
    o.fillStyle = "#fff"; o.textAlign = "center"; o.textBaseline = "middle";
    let size = Math.round(off.height * 1.02);
    o.font = `${size}px Anton, "Space Grotesk", sans-serif`;
    while (o.measureText(text).width > S * 0.92 && size > 20) {
      size -= 6; o.font = `${size}px Anton, "Space Grotesk", sans-serif`;
    }
    o.fillText(text, S / 2, off.height / 2 + off.height * 0.03);
    const data = o.getImageData(0, 0, off.width, off.height).data;
    const pts = [];
    for (let y = STEP / 2; y < off.height; y += STEP) {
      for (let x = STEP / 2; x < S; x += STEP) {
        if (data[(Math.floor(y) * S + Math.floor(x)) * 4] > 120) {
          pts.push({ x: x - S / 2, y: y - off.height / 2 });
        }
      }
    }
    targets = pts;
  }

  function buildParts() {
    parts = targets.map(t => {
      const ang = Math.random() * Math.PI * 2;
      const rad = Math.max(W, H) * (0.6 + Math.random() * 0.9);
      return {
        tx: t.x, ty: t.y,
        sx: Math.cos(ang) * rad, sy: Math.sin(ang) * rad,
        sz: -700 - Math.random() * 1700,
        delay: Math.random() * 0.5,
        spin: (Math.random() - 0.5) * 5,
        pale: Math.random() < 0.3,            // 一部を淡い朱にして奥行きを出す
      };
    });
  }

  function paint(elapsed) {
    const gp = reduce ? 1 : Math.min(elapsed / DURATION, 1);
    const assembled = gp >= 1;
    const idleT = Math.max(0, elapsed - DURATION) / 1000;
    const yaw = assembled && !reduce ? Math.sin(idleT * 0.5) * 0.4 : 0;
    const cosY = Math.cos(yaw), sinY = Math.sin(yaw);

    ctx.clearRect(0, 0, W, H);
    // キャンバス帯のなかに収める（帯は上下の文字を避けて配置済み）
    const GH = 270, GW = 478;                    // オフスクリーン上の文字の最大寸法
    const scale = Math.min(H * 0.92 / GH, W * 0.72 / GW);
    const cx = W / 2, cy = H / 2;
    const focal = 950;

    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      let lp = (gp - p.delay) / (1 - p.delay);
      lp = Math.max(0, Math.min(1, lp));
      const e = easeOutCubic(lp);
      let rx, ry, rz;
      if (assembled) { rx = p.tx * cosY; rz = p.tx * sinY; ry = p.ty; }
      else {
        rx = p.sx + (p.tx - p.sx) * e;
        ry = p.sy + (p.ty - p.sy) * e;
        rz = p.sz + (0 - p.sz) * e;
      }
      const persp = focal / (focal + rz);
      const sx = cx + rx * scale * persp;
      const sy = cy + ry * scale * persp;
      const d = TILE * scale * persp * (0.55 + 0.45 * e);
      ctx.globalAlpha = Math.max(0, Math.min(1, e * 1.4));
      ctx.fillStyle = p.pale ? "#e1897e" : "#c0392b";
      if (!assembled && e < 1) {
        ctx.save(); ctx.translate(sx, sy); ctx.rotate(p.spin * (1 - e));
        ctx.fillRect(-d / 2, -d / 2, d, d); ctx.restore();
      } else {
        ctx.fillRect(sx - d / 2, sy - d / 2, d, d);
      }
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    if (!running) return;
    if (t0 === null) t0 = now;
    paint(now - t0);
    raf = requestAnimationFrame(frame);
  }

  function play() {
    if (!text) return;
    resize(); buildTargets(); buildParts();
    t0 = null; running = true;
    // タブが裏にあると requestAnimationFrame が止まるので、
    // 完成形だけは同期で描いておく（裏で開かれても数字が見える）
    if (reduce || document.hidden) paint(DURATION);
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
  }
  function stop() { running = false; if (raf) cancelAnimationFrame(raf); }

  // 表に戻ってきたら描き直す（裏にいる間は rAF が進まないため）
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && running) { t0 = null; raf = requestAnimationFrame(frame); }
  });
  addEventListener("resize", () => {
    if (!running) return;
    resize(); buildTargets(); buildParts();
    if (document.hidden) paint(DURATION);
  });
  cv.addEventListener("click", play);
  $("#replay") && $("#replay").addEventListener("click", play);

  // 画面内にあるときだけ動かす（電池・CPU節約）
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(es => es.forEach(en => {
      if (en.isIntersecting) { if (!running) play(); } else stop();
    }), { threshold: 0.12 }).observe(hero);
  }

  return {
    setText(t) {
      text = String(t);
      (document.fonts ? document.fonts.ready : Promise.resolve()).then(play);
    }
  };
})();

/* ---------- 描画 ---------- */
let DATA = null;
function render() {
  const d = DATA; if (!d) return;
  const days = d.daily || [], runs = d.runs || [];
  const today = days.length ? days[days.length-1] : null;
  $("#gen").textContent = (d.generated_at||"").replace("T"," ").slice(0,16);

  $("#heroFollowers").textContent = today ? `フォロワー ${N(today.followers)}人` : "—";
  if (today && today.followers != null) Hero.setText(today.followers);
  const g = today ? today.follower_gain : null;
  $("#heroDelta").innerHTML = g == null ? "" :
    `<span class="tag ${g>0?"up":""}">${g>0?"▲":g<0?"▼":"—"} ${g>0?"+":""}${N(g)} 本日</span>`;
  spark($("#spark"), days);

  const rate = today && today.gain_per_foryou_pct != null ? today.gain_per_foryou_pct : null;
  $("#heroStats").innerHTML = today ? [
    {k:"いいね合計", v:N(today.total_likes), u:"件", n:`本日 ${today.runs_ok}/${today.runs_total} 回完了`},
    {k:"おすすめ", v:N(today.foryou_likes), u:"件", i:"var(--s1)"},
    {k:"フォロー中", v:N(today.following_likes), u:"件", i:"var(--s2)"},
    {k:"増加率", v:rate==null?"—":rate, u:rate==null?"":"%", n:"おすすめ100件あたり"},
  ].map(x=>`<div class="hs">
      <div class="k">${x.i?`<i style="background:${x.i}"></i>`:""}${x.k}</div>
      <div class="v num">${x.v}${x.u?`<small>${x.u}</small>`:""}</div>
      ${x.n?`<div class="n">${x.n}</div>`:""}</div>`).join("")
    : '<div class="hs"><div class="n">まだデータがありません</div></div>';

  const todayStr = today ? today.date : "", byHour = {};
  runs.filter(r => (r.at||"").startsWith(todayStr)).forEach(r => {
    byHour[r.hour] = {got:(r.following.liked||0)+(r.foryou.liked||0),
                      want:(r.following.target||0)+(r.foryou.target||0), ok:r.ok, note:r.note};
  });
  let hh = "";
  for (let h = 7; h <= 22; h++) {
    const v = byHour[h];
    const cls = !v ? "idle" : v.ok ? "ok" : (v.got > 0 ? "part" : "bad");
    const mark = !v ? "—" : v.ok ? "✓" : (v.got>0 ? `△ ${v.got}` : "✕");
    const pct = v && v.want ? Math.min(100, Math.round(v.got/v.want*100)) : 0;
    hh += `<div class="hr ${cls}" data-h="${h}"><div class="t">${String(h).padStart(2,"0")}</div>
      <div class="m">${mark}</div><div class="fill" style="width:${cls==="part"?pct:100}%"></div></div>`;
  }
  $("#hours").innerHTML = hh;
  $("#hours").querySelectorAll(".hr").forEach(n => {
    const v = byHour[n.dataset.h];
    n.addEventListener("mousemove", e => showTip(
      v ? `<b>${String(n.dataset.h).padStart(2,"0")}:00 の実行</b>
           <div class="row"><span>いいね</span><span>${v.got} / ${v.want}</span></div>
           <div class="row"><span>結果</span><span>${v.ok?"完了":(v.note||"未達")}</span></div>`
        : `<b>${String(n.dataset.h).padStart(2,"0")}:00</b><div class="row"><span>まだ実行されていません</span></div>`, e));
    n.addEventListener("mouseleave", hideTip);
  });

  lineChart($("#chartFollowers"), days, "followers", cssv("--s1"), {label:"フォロワー", fill:true});
  stackedBars($("#chartLikes"), days);
  lineChart($("#chartRate"), days, "gain_per_foryou_pct", cssv("--s1"),
    {label:"増加率", unit:"%", fill:false, zeroLine:true});

  $("#dailyTable").innerHTML = days.length ? `<table>
    <thead><tr><th>日付</th><th>フォロワー</th><th>増加</th><th>おすすめ</th>
      <th>フォロー中</th><th>合計</th><th>増加率</th><th>実行</th></tr></thead>
    <tbody>${days.slice().reverse().map(x=>`<tr>
      <td class="num">${x.date}</td><td class="num">${N(x.followers)}</td>
      <td class="num ${x.follower_gain>0?"up":"zero"}">${x.follower_gain>0?"+":""}${N(x.follower_gain)}</td>
      <td class="num">${N(x.foryou_likes)}</td><td class="num">${N(x.following_likes)}</td>
      <td class="num">${N(x.total_likes)}</td>
      <td class="num">${x.gain_per_foryou_pct==null?"—":x.gain_per_foryou_pct+"%"}</td>
      <td class="num">${x.runs_ok}/${x.runs_total}</td></tr>`).join("")}</tbody></table>`
    : '<div class="empty">まだデータがありません</div>';

  $("#runsTable").innerHTML = runs.length ? `<table>
    <thead><tr><th>実行時刻</th><th>フォロー中</th><th>おすすめ</th><th>フォロワー</th><th>結果</th></tr></thead>
    <tbody>${runs.slice().reverse().slice(0,40).map(r=>{
      const got=(r.following.liked||0)+(r.foryou.liked||0);
      const cls = r.ok?"ok":(got>0?"part":"bad"), lab = r.ok?"✓ 完了":(got>0?"△ 一部のみ":"✕ 失敗");
      return `<tr><td class="num">${(r.at||"").replace("T"," ")}</td>
        <td class="num">${r.following.liked||0} / ${r.following.target||0}</td>
        <td class="num">${r.foryou.liked||0} / ${r.foryou.target||0}</td>
        <td class="num">${N(r.followers)}</td>
        <td><span class="pill ${cls}">${lab}</span></td></tr>`;}).join("")}</tbody></table>`
    : '<div class="empty">まだ実行されていません</div>';
}

$("#themebtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "dark"
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("theme", next); } catch(e) {}
  render();
});
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch(e) {}

let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 160); });

fetch("data.json?" + Date.now()).then(r => r.json()).then(d => { DATA = d; render(); })
  .catch(e => { $("#heroStats").innerHTML = `<div class="hs"><div class="n">データを読み込めませんでした（${e}）</div></div>`; });
</script>
